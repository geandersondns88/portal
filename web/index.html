<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portal de assinaturas</title>
<style>
  :root { --fundo:#f6f7f9; --card:#fff; --texto:#15202b; --suave:#5b6b7b; --borda:#d9dee5; --destaque:#0b6e99; --ok:#137a3f; --aviso:#8a5a00; --erro:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --fundo:#0e1419; --card:#161e26; --texto:#e8edf2; --suave:#93a3b3; --borda:#2a3643; --destaque:#4cb3d9; --ok:#4cc27d; --aviso:#f0b64d; --erro:#ff8a80; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fundo); color:var(--texto); font:16px/1.45 system-ui, sans-serif; }
  a { color:var(--destaque); }
  header { background:var(--card); border-bottom:1px solid var(--borda); position:sticky; top:0; z-index:5; }
  .barra { max-width:960px; margin:0 auto; padding:10px 16px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; }
  .barra h1 { font-size:1.05rem; margin:0 8px 0 0; }
  nav { display:flex; flex-wrap:wrap; gap:4px; flex:1; }
  nav a, .abas a { padding:6px 12px; border-radius:8px; color:var(--suave); text-decoration:none; font-weight:600; }
  nav a[aria-current="page"], .abas a[aria-current="page"] { background:var(--destaque); color:#fff; }
  main { max-width:960px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  h2 { font-size:1.15rem; margin:0; } h3 { font-size:1rem; margin:0; }
  .card { background:var(--card); border:1px solid var(--borda); border-radius:12px; padding:16px; display:grid; gap:12px; }
  label { display:grid; gap:4px; font-size:.9rem; color:var(--suave); }
  label.marca { display:flex; align-items:center; gap:8px; }
  input, select, button, textarea { font:inherit; padding:9px 11px; border-radius:8px; border:1px solid var(--borda); background:var(--card); color:var(--texto); min-height:40px; }
  input[type=checkbox] { min-height:0; width:18px; height:18px; padding:0; }
  button { cursor:pointer; background:var(--destaque); border-color:var(--destaque); color:#fff; font-weight:600; }
  button.sec { background:transparent; color:var(--texto); border-color:var(--borda); }
  button.perigo { background:transparent; color:var(--erro); border-color:var(--erro); }
  button:disabled { opacity:.6; cursor:wait; }
  .linha { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .espaco { justify-content:space-between; }
  .dica { font-size:.84rem; color:var(--suave); margin:0; }
  .msg { padding:9px 11px; border-radius:8px; border:1px solid var(--borda); font-size:.92rem; }
  .msg.ok { color:var(--ok); border-color:var(--ok); } .msg.erro { color:var(--erro); border-color:var(--erro); } .msg.aviso { color:var(--aviso); border-color:var(--aviso); }
  .oculto { display:none !important; }
  .grade { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:12px; }
  .caixa { text-align:center; background:var(--card); color:var(--texto); border:1px solid var(--borda); padding:22px 14px; display:grid; justify-items:center; gap:10px; border-radius:14px; min-height:140px; align-content:center; }
  .caixa:hover, .item:hover { border-color:var(--destaque); }
  svg { width:30px; height:30px; color:var(--destaque); flex:none; }
  .caixa svg { width:48px; height:48px; }
  .caixa strong { font-size:1.05rem; }
  .abas { display:flex; flex-wrap:wrap; gap:4px; border-bottom:1px solid var(--borda); padding-bottom:8px; }
  .lista { display:grid; gap:8px; }
  .item { background:var(--card); border:1px solid var(--borda); border-radius:12px; padding:12px 14px; display:grid; gap:6px; text-align:left; color:var(--texto); font-weight:400; }
  .item .topo { display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px; align-items:center; }
  .item .meta { color:var(--suave); font-size:.86rem; display:flex; flex-wrap:wrap; gap:4px 14px; }
  .selo { display:inline-block; padding:2px 9px; border-radius:999px; font-size:.8rem; font-weight:700; border:1px solid currentColor; }
  .selo.ok { color:var(--ok); } .selo.erro { color:var(--erro); } .selo.aviso { color:var(--aviso); } .selo.neutro { color:var(--suave); }
  .filtros { display:grid; grid-template-columns:1fr; gap:8px; }
  @media (min-width:600px) { .filtros { grid-template-columns:1fr 180px auto auto; align-items:end; } }
  dialog { border:1px solid var(--borda); border-radius:14px; background:var(--card); color:var(--texto); padding:0; width:min(560px, calc(100vw - 24px)); }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  .conteudo { padding:16px; display:grid; gap:12px; max-height:85vh; overflow:auto; }
  .eventos { display:grid; gap:6px; font-size:.86rem; color:var(--suave); }
  .ponto { width:12px; height:12px; border-radius:50%; display:inline-block; margin-right:6px; background:currentColor; }
  .dois { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
</style>
</head>
<body>
<header class="oculto" id="cabecalho">
  <div class="barra">
    <h1>Portal de assinaturas</h1>
    <nav aria-label="Principal">
      <a href="#/sistemas" data-rota="sistemas">Sistemas</a>
      <a href="#/mercadopago" data-rota="mercadopago">Mercado Pago</a>
    </nav>
    <button id="sair" class="sec">Sair</button>
  </div>
</header>

<main>
  <section id="entrar" class="card oculto">
    <h2>Entrar</h2>
    <form id="form-entrar" style="display:grid;gap:12px">
      <label>E-mail <input id="email" type="email" autocomplete="username" required></label>
      <label>Senha <input id="senha" type="password" autocomplete="current-password" required></label>
      <button type="submit">Entrar</button>
    </form>
    <div id="msg-entrar" class="msg erro oculto" role="alert"></div>
  </section>
  <div id="vista"></div>
</main>

<dialog id="dlg"><div class="conteudo" id="dlg-conteudo"></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // Projeto "Portal". A chave publicável é pública por natureza; quem protege os dados é o login + a lista de administradores no servidor.
  // As telas são iguais para todos os sistemas: tudo vem da tabela `sistemas` (cada sistema segue o mesmo contrato de API).
  const URL_PORTAL = 'https://vzoyugnoywtgnvabatrw.supabase.co'
  const CHAVE_PUBLICA = 'sb_publishable_OU8JICbHiBK3FT-7cLb5Vg_k2bdT1C1'
  const banco = supabase.createClient(URL_PORTAL, CHAVE_PUBLICA)
  const $ = (id) => document.getElementById(id)
  const POR_PAGINA = 20
  let temporizador = null

  // ---------- utilidades ----------
  function el(tag, props, ...filhos) {
    const e = document.createElement(tag)
    for (const [k, v] of Object.entries(props || {})) {
      if (k === 'class') e.className = v
      else if (k === 'value') e.value = v
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v)
      else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v)
    }
    for (const f of filhos.flat()) if (f != null && f !== false) e.append(f.nodeType ? f : document.createTextNode(String(f)))
    return e
  }
  const aviso = (texto, tipo) => el('div', { class: 'msg ' + (tipo || ''), role: tipo === 'erro' ? 'alert' : 'status' }, texto)
  const dataBr = (iso) => (iso ? iso.slice(0, 10).split('-').reverse().join('/') : '—')
  const dataHoraBr = (iso) => (iso ? new Date(iso).toLocaleString('pt-BR') : '—')
  const moeda = (n) => Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
  function documentoBr(d) {
    const n = String(d || '').replace(/\D/g, '')
    if (n.length === 14) return n.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5')
    if (n.length === 11) return n.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')
    return n || '—'
  }
  const ROTULO_STATUS = { trial: ['Teste', 'aviso'], ativa: ['Ativa', 'ok'], suspensa: ['Suspensa', 'erro'], cancelada: ['Cancelada', 'neutro'] }
  const selo = (status) => { const [t, c] = ROTULO_STATUS[status] || [status, 'neutro']; return el('span', { class: 'selo ' + c }, t) }

  // ícones dos sistemas (cada um escolhido na coluna `icone` da tabela sistemas); traçados fixos, sem conteúdo de terceiros
  const ICONES = {
    caminhao: ['M3 7h11v9H3z', 'M14 10h4l3 3v3h-7z', 'M7.5 19a1.8 1.8 0 100-3.6 1.8 1.8 0 000 3.6z', 'M17.5 19a1.8 1.8 0 100-3.6 1.8 1.8 0 000 3.6z'],
    onibus: ['M4 5h16v12H4z', 'M4 11h16', 'M7 20v-3', 'M17 20v-3', 'M7.5 14h.01', 'M16.5 14h.01'],
    loja: ['M4 9l1.5-5h13L20 9', 'M4 9h16v11H4z', 'M9 20v-6h6v6'],
    pessoas: ['M9 11a3 3 0 100-6 3 3 0 000 6z', 'M3 19c0-3 2.7-5 6-5s6 2 6 5', 'M16 11a2.5 2.5 0 100-5', 'M17 14c2.3.3 4 1.9 4 4'],
    calendario: ['M4 6h16v14H4z', 'M4 10h16', 'M8 3v4', 'M16 3v4'],
    app: ['M5 5h6v6H5z', 'M13 5h6v6h-6z', 'M5 13h6v6H5z', 'M13 13h6v6h-6z'],
  }
  function icone(nome) {
    const ns = 'http://www.w3.org/2000/svg'
    const svg = document.createElementNS(ns, 'svg')
    svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('fill', 'none'); svg.setAttribute('stroke', 'currentColor')
    svg.setAttribute('stroke-width', '1.6'); svg.setAttribute('stroke-linecap', 'round'); svg.setAttribute('stroke-linejoin', 'round'); svg.setAttribute('aria-hidden', 'true')
    for (const d of ICONES[nome] || ICONES.app) { const p = document.createElementNS(ns, 'path'); p.setAttribute('d', d); svg.append(p) }
    return svg
  }

  async function chamar(funcao, corpo) {
    const { data, error } = await banco.functions.invoke(funcao, { body: corpo })
    if (error) {
      let texto = 'Algo deu errado. Tente novamente.'
      try { const j = await error.context.json(); if (j && j.erro) texto = j.erro } catch (_) {}
      throw new Error(texto)
    }
    return data
  }

  // ---------- roteamento ----------
  // #/sistemas  ·  #/s/<codigo>/(clientes|status|planos)  ·  #/mercadopago
  function parar() { if (temporizador) { clearInterval(temporizador); temporizador = null } }
  async function rotear() {
    parar()
    const { data } = await banco.auth.getSession()
    const logado = !!data.session
    $('cabecalho').classList.toggle('oculto', !logado)
    $('entrar').classList.toggle('oculto', logado)
    if (!logado) { $('vista').replaceChildren(); return }
    const partes = (location.hash.replace(/^#\/?/, '') || 'sistemas').split('/')
    const secao = partes[0] === 's' ? 'sistemas' : partes[0]
    document.querySelectorAll('nav a').forEach((a) => (a.dataset.rota === secao ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')))
    const vista = $('vista'); vista.replaceChildren(aviso('Carregando…'))
    try {
      if (partes[0] === 's' && partes[1]) await telaSistema(decodeURIComponent(partes[1]), partes[2] || 'clientes')
      else if (secao === 'sistemas') await telaPrincipal()
      else if (secao === 'mercadopago') await telaMercadoPago()
      else location.hash = '#/sistemas'
    } catch (e) { vista.replaceChildren(aviso(e.message, 'erro')) }
  }
  window.addEventListener('hashchange', rotear)

  // ---------- tela principal: uma caixa por sistema ----------
  async function telaPrincipal() {
    const { sistemas } = await chamar('portal-geral', { acao: 'sistemas' })
    $('vista').replaceChildren(el('div', { class: 'card' },
      el('h2', {}, 'Sistemas'),
      el('p', { class: 'dica' }, 'Escolha um sistema para ver os clientes, o status dos serviços e configurar os planos de assinatura.'),
      sistemas.length === 0 ? aviso('Nenhum sistema cadastrado.', 'aviso')
        : el('div', { class: 'grade' }, sistemas.map((s) => el('button', { class: 'caixa', onclick: () => (location.hash = '#/s/' + encodeURIComponent(s.codigo) + '/clientes') }, icone(s.icone), el('strong', {}, s.nome))))))
  }

  // ---------- um sistema: Clientes · Status dos serviços · Planos ----------
  async function telaSistema(codigo, aba) {
    const { sistemas } = await chamar('portal-geral', { acao: 'sistemas' })
    const sistema = sistemas.find((s) => s.codigo === codigo)
    if (!sistema) throw new Error('Sistema não encontrado.')
    const base = '#/s/' + encodeURIComponent(codigo) + '/'
    const abas = [['clientes', 'Clientes'], ['status', 'Status dos serviços'], ['planos', 'Planos de assinatura']]
    const conteudo = el('div', { style: 'display:grid;gap:12px' })
    $('vista').replaceChildren(el('div', { class: 'card' },
      el('div', { class: 'linha espaco' }, el('div', { class: 'linha' }, icone(sistema.icone), el('h2', {}, sistema.nome)), el('a', { href: '#/sistemas' }, '← Todos os sistemas')),
      el('nav', { class: 'abas', 'aria-label': 'Áreas do sistema' }, abas.map(([id, rotulo]) => el('a', { href: base + id, ...(id === aba ? { 'aria-current': 'page' } : {}) }, rotulo))),
      conteudo))
    if (aba === 'status') await abaStatus(codigo, conteudo)
    else if (aba === 'planos') await abaPlanos(codigo, conteudo)
    else await abaClientes(codigo, conteudo)
  }

  // Sistemas com licença de aplicativo (Gestor+): o uso é medido em computadores e, vencida a carência, o sistema vira somente leitura (não "bloqueia").
  const ROTULO_SITUACAO = { ok: ['Em dia', 'ok'], aviso: ['Vencimento próximo', 'aviso'], carencia: ['Vencida (em carência)', 'aviso'], somente_leitura: ['Somente leitura', 'erro'], aguardando: ['Aguardando liberação', 'aviso'] }
  const diasTxt = (n) => `${n} dia${n === 1 ? '' : 's'}`
  function textoSituacao(s, dias) {
    if (s === 'aviso') return dias === 0 ? 'Vence hoje' : 'Vence em ' + diasTxt(dias)
    if (s === 'carencia') return `Vencida: restam ${diasTxt(dias)} de carência`
    if (s === 'somente_leitura') return dias != null ? `Somente leitura (${diasTxt(dias)} de atraso)` : 'Somente leitura'
    return (ROTULO_SITUACAO[s] || [s || '—'])[0]
  }
  const usoDaEmpresa = (codigo, e) => (codigo === 'gestor'
    ? `${e.computadores} computador(es) · ${e.chaves ? e.chaves + ' chave' + (e.chaves > 1 ? 's' : '') : 'sem chave'}`
    : `${e.usuarios} usuário(s) · ${e.veiculos} veículo(s)`)
  function situacaoDaEmpresa(codigo, e) {
    if (codigo !== 'gestor') return e.liberada ? null : el('span', { style: 'color:var(--erro)' }, 'Acesso bloqueado')
    const cls = (ROTULO_SITUACAO[e.situacao] || [0, 'neutro'])[1]
    return cls === 'ok' ? null : el('span', { style: 'color:var(--' + (cls === 'erro' ? 'erro' : 'aviso') + ')' }, textoSituacao(e.situacao, e.dias))
  }
  const ROTULO_ACAO = { chave_gerada: 'Chave gerada', chave_substituida: 'Chave substituída', chave_bloqueada: 'Chave bloqueada', chave_desbloqueada: 'Chave desbloqueada', computador_ativado: 'Computador ativado', computador_liberado: 'Computador liberado',
    limite_definido: 'Limite de computadores', vencimento_definido: 'Vencimento', recuperacao_gerada: 'Código de recuperação gerado', recuperacao_usada: 'Código de recuperação usado', cadastro: 'Pedido de licença', importada: 'Importada' }
  function textoEvento(ev) {
    const a = ev.anterior, d = ev.depois
    let mud = ''
    if (a && d && a.status !== undefined && d.status !== undefined) mud = ` (${a.status} → ${d.status})`
    else if (a && d && 'vencimento' in d) mud = ` (${dataBr(a.vencimento)} → ${d.vencimento ? dataBr(d.vencimento) : 'sem vencimento'})`
    else if (a && d && 'limite' in d) mud = ` (${a.limite == null ? 'plano' : a.limite} → ${d.limite == null ? 'plano' : d.limite})`
    return `${dataHoraBr(ev.criado_em)} · ${ROTULO_ACAO[ev.acao] || ev.acao}${mud}${ev.detalhes && ev.detalhes.motivo ? ' · ' + ev.detalhes.motivo : ''}${ev.detalhes && ev.detalhes.nome ? ' · ' + ev.detalhes.nome : ''}`
  }

  // ----- Clientes -----
  async function abaClientes(codigo, raiz) {
    const estado = { busca: '', status: '', pagina: 0, total: 0 }
    let planos = []
    try { planos = (await chamar('chamar-sistema', { sistema: codigo, acao: 'planos_listar' })).planos } catch (_) {}
    const busca = el('input', { type: 'search', placeholder: 'Nome, fantasia ou CNPJ/CPF', 'aria-label': 'Buscar' })
    const status = el('select', { 'aria-label': 'Situação' }, el('option', { value: '' }, 'Todas as situações'), ...Object.entries(ROTULO_STATUS).map(([v, [t]]) => el('option', { value: v }, t)))
    const caixa = el('div', { class: 'lista' })
    const rodape = el('div', { class: 'linha espaco' })
    const resultado = el('div', { class: 'oculto' })
    async function carregar() {
      caixa.replaceChildren(aviso('Carregando…'))
      try {
        const r = await chamar('chamar-sistema', { sistema: codigo, acao: 'listar', busca: estado.busca || undefined, status: estado.status || undefined, limite: POR_PAGINA, deslocamento: estado.pagina * POR_PAGINA })
        estado.total = r.total
        caixa.replaceChildren(...(r.empresas.length ? r.empresas.map((e) => linhaDaEmpresa(e)) : [aviso('Nenhum cliente encontrado.', 'aviso')]))
        const paginas = Math.max(1, Math.ceil(r.total / POR_PAGINA))
        rodape.replaceChildren(
          el('span', { class: 'dica' }, `${r.total} cliente(s) · página ${estado.pagina + 1} de ${paginas}`),
          el('div', { class: 'linha' },
            el('button', { class: 'sec', disabled: estado.pagina === 0, onclick: () => { estado.pagina--; carregar() } }, 'Anterior'),
            el('button', { class: 'sec', disabled: estado.pagina + 1 >= paginas, onclick: () => { estado.pagina++; carregar() } }, 'Próxima')))
      } catch (e) { caixa.replaceChildren(aviso(e.message, 'erro')); rodape.replaceChildren() }
    }
    function linhaDaEmpresa(e) {
      return el('button', { class: 'item', onclick: () => abrirEmpresa(codigo, e, planos, carregar) },
        el('div', { class: 'topo' }, el('strong', {}, e.nome_fantasia || e.nome), selo(e.status)),
        el('div', { class: 'meta' },
          el('span', {}, documentoBr(e.documento)),
          e.email ? el('span', {}, e.email) : null,
          el('span', {}, 'Plano: ' + nomeDoPlano(planos, e.plano_codigo)),
          e.status === 'trial' ? el('span', {}, 'Teste até ' + dataBr(e.trial_ate)) : null,
          el('span', {}, usoDaEmpresa(codigo, e)),
          situacaoDaEmpresa(codigo, e)))
    }
    const sincronizar = el('button', { class: 'sec', onclick: async () => {
      sincronizar.disabled = true; resultado.className = 'msg'; resultado.textContent = 'Sincronizando…'
      try {
        const r = await chamar('portal-geral', { acao: 'sincronizar', sistema: codigo })
        resultado.className = 'msg ok'; resultado.textContent = `Sincronizado: ${r.total} empresa(s) no sistema, ${r.criados} nova(s) no portal.`
      } catch (e) { resultado.className = 'msg erro'; resultado.textContent = e.message }
      sincronizar.disabled = false
    } }, 'Sincronizar com o portal')
    let espera
    busca.addEventListener('input', () => { clearTimeout(espera); espera = setTimeout(() => { estado.busca = busca.value.trim(); estado.pagina = 0; carregar() }, 350) })
    status.addEventListener('change', () => { estado.status = status.value; estado.pagina = 0; carregar() })
    raiz.replaceChildren(
      el('p', { class: 'dica' }, 'Quem se cadastra no sistema entra aqui sozinho, com o teste grátis. "Sincronizar" recupera algum cadastro que não tenha chegado.'),
      el('div', { class: 'filtros' }, el('label', {}, 'Buscar', busca), el('label', {}, 'Situação', status), el('button', { class: 'sec', onclick: carregar }, 'Atualizar'), sincronizar),
      resultado, caixa, rodape)
    await carregar()
  }
  const nomeDoPlano = (planos, cod) => { const p = planos.find((x) => x.codigo === cod); return p ? p.nome : cod }

  // ----- detalhe e ações de uma assinatura -----
  function abrirEmpresa(codigo, e, planos, aoMudar) {
    const dlg = $('dlg'), c = $('dlg-conteudo')
    const resultado = el('div', { class: 'oculto' })
    const motivo = el('input', { maxlength: 300, placeholder: 'Opcional: fica registrado no histórico', 'aria-label': 'Motivo' })
    const dias = el('input', { type: 'number', min: 1, max: 365, value: 7, 'aria-label': 'Dias de teste', style: 'width:90px' })
    const opcoes = planos.filter((p) => p.ativo || p.codigo === e.plano_codigo)
    const plano = opcoes.length
      ? el('select', { 'aria-label': 'Plano' }, opcoes.map((p) => el('option', { value: p.codigo, ...(p.codigo === e.plano_codigo ? { selected: true } : {}) }, `${p.nome} (${p.codigo})`)))
      : el('input', { value: e.plano_codigo, maxlength: 40, 'aria-label': 'Código do plano', style: 'width:160px' })
    const historico = el('div', { class: 'eventos' })
    const atual = { ...e }
    const painel = codigo === 'gestor' ? el('div', { class: 'card', style: 'padding:12px' }, aviso('Carregando a licença…')) : null

    function desenhar() {
      c.replaceChildren(
        el('div', { class: 'linha espaco' }, el('h2', {}, atual.nome_fantasia || atual.nome), el('button', { class: 'sec', onclick: () => dlg.close() }, 'Fechar')),
        el('div', { style: 'display:grid;gap:2px;color:var(--suave);font-size:.9rem' },
          el('span', {}, atual.nome), el('span', {}, 'CNPJ/CPF: ' + documentoBr(atual.documento)),
          el('span', {}, 'E-mail: ' + (atual.email || '—')), el('span', {}, 'Telefone: ' + (atual.telefone || '—')),
          el('span', {}, 'Cliente desde ' + dataBr(atual.criada_em))),
        el('div', { class: 'linha' }, selo(atual.status), el('span', {}, 'Plano: ' + nomeDoPlano(planos, atual.plano_codigo)),
          atual.status === 'trial' ? el('span', {}, 'Teste até ' + dataBr(atual.trial_ate)) : null,
          el('span', { style: 'color:' + (atual.liberada ? 'var(--ok)' : 'var(--erro)') }, codigo === 'gestor' ? (atual.liberada ? 'Uso liberado' : 'Somente leitura') : (atual.liberada ? 'Acesso liberado' : 'Acesso bloqueado'))),
        el('label', {}, 'Motivo da alteração', motivo),
        el('div', { class: 'linha' },
          el('button', { onclick: () => agir('ativar', {}, 'Ativar esta assinatura?') }, 'Ativar'),
          el('button', { class: 'perigo', onclick: () => agir('suspender', {}, 'Suspender? O acesso da empresa será bloqueado.') }, 'Suspender'),
          el('button', { class: 'perigo', onclick: () => agir('cancelar', {}, 'Cancelar esta assinatura?') }, 'Cancelar')),
        el('div', { class: 'linha' }, el('label', {}, 'Estender teste (dias)', dias), el('button', { class: 'sec', onclick: () => agir('estender_teste', { dias: Number(dias.value) }) }, 'Estender')),
        el('div', { class: 'linha' }, el('label', {}, 'Plano', plano), el('button', { class: 'sec', onclick: () => agir('trocar_plano', { plano_codigo: plano.value.trim() }, 'Trocar o plano?') }, 'Trocar plano')),
        resultado,
        painel,
        el('h3', {}, 'Histórico'), historico)
    }
    async function agir(acao, dados, confirmacao) {
      if (confirmacao && !confirm(confirmacao)) return
      resultado.className = 'msg'; resultado.textContent = 'Enviando…'
      const botoes = c.querySelectorAll('button'); botoes.forEach((b) => (b.disabled = true))
      try {
        const m = motivo.value.trim()
        const r = await chamar('chamar-sistema', { sistema: codigo, acao, empresa_id: atual.empresa_id, dados: { ...dados, ...(m ? { motivo: m } : {}) } })
        Object.assign(atual, { status: r.assinatura.status, plano_codigo: r.assinatura.plano_codigo, trial_ate: r.assinatura.trial_ate, liberada: r.assinatura.liberada })
        const guardados = { motivo: motivo.value, dias: dias.value, plano: plano.value }
        desenhar(); motivo.value = guardados.motivo; dias.value = guardados.dias; plano.value = guardados.plano
        resultado.className = 'msg ok'; resultado.textContent = 'Alteração feita.'
        aoMudar(); carregarHistorico(); carregarPainel()
      } catch (err) {
        botoes.forEach((b) => (b.disabled = false))
        resultado.className = 'msg erro'; resultado.textContent = err.message
      }
    }
    async function carregarHistorico() {
      try {
        const r = await chamar('chamar-sistema', { sistema: codigo, acao: 'eventos', empresa_id: atual.empresa_id, limite: 10 })
        historico.replaceChildren(...(r.eventos.length ? r.eventos.map((ev) => el('div', {}, textoEvento(ev))) : [el('span', {}, 'Nenhuma alteração feita pelo portal ainda.')]))
      } catch (err) { historico.replaceChildren(aviso(err.message, 'erro')) }
    }

    // ----- painel do Gestor+: licença, vencimento, chave, computadores e recuperação de acesso -----
    async function acaoGestor(acao, dados, confirmacao, mensagem) {

      try {

        if (r.assinatura) Object.assign(atual, { status: r.assinatura.status, plano_codigo: r.assinatura.plano_codigo, trial_ate: r.assinatura.trial_ate, liberada: r.assinatura.liberada })
        const guardados = { motivo: motivo.value, dias: dias.value, plano: plano.value }
        desenhar(); motivo.value = guardados.motivo; dias.value = guardados.dias; plano.value = guardados.plano
        resultado.className = 'msg ok'; resultado.textContent = mensagem ? mensagem(r) : 'Alteração feita.'
        aoMudar(); carregarHistorico(); carregarPainel()
      } catch (err) {
        botoes.forEach((b) => (b.disabled = false))
        resultado.className = 'msg erro'; resultado.textContent = err.message

    }
    const erroLocal = (texto) => { resultado.className = 'msg erro'; resultado.textContent = texto }
    const msgChave = (x) => (x.email && x.email.enviado ? 'Chave enviada por e-mail.' : x.email && x.email.motivo && x.email.motivo !== 'Envio não solicitado.' ? 'Chave pronta, mas o e-mail NÃO foi enviado: ' + x.email.motivo : 'Chave pronta.')
    async function carregarPainel() {
      if (!painel) return
      try { desenharPainel(await chamar('chamar-sistema', { sistema: codigo, acao: 'licenca_ver', empresa_id: atual.empresa_id })) }

    }
    function desenharPainel(r) {
      const s = r.situacao || {}, licencas = r.licencas || []

      const copiar = async (chave) => {

      }

      const blocoChave = (lic, n) => {

        return el('div', { class: 'card', style: 'padding:10px' },

            el('button', { class: 'sec', onclick: () => copiar(lic.chave) }, 'Copiar'),
            el('button', { class: 'sec', onclick: () => acaoGestor('chave_reenviar', dela, `Enviar esta chave para ${r.empresa.email || 'a empresa'}?`, msgChave) }, 'Enviar por e-mail'),
            lic.status === 'ativa' ? el('button', { class: 'perigo', onclick: () => acaoGestor('chave_bloquear', dela, 'Bloquear esta chave? Os computadores dela deixam de validar.') }, 'Bloquear')
              : el('button', { class: 'sec', onclick: () => acaoGestor('chave_desbloquear', dela) }, 'Desbloquear'),
            el('button', { class: 'perigo', onclick: () => acaoGestor('chave_gerar', { modo: 'substituir', chave: lic.chave }, 'Trocar esta chave por uma NOVA? A atual deixa de valer e os computadores dela precisam ativar de novo.', msgChave) }, 'Nova chave')),
          el('strong', {}, `Computadores (${ms.length} de ${lic.limite_computadores == null ? 'ilimitados' : lic.limite_computadores})`),
          ...(ms.length ? ms.map((m) => el('div', { class: 'linha espaco' },
            el('span', { class: 'dica' }, `${m.nome || 'sem nome'} · versão ${m.versao || '?'} · ativado em ${dataBr(m.ativada_em)} · último contato ${m.ultimo_contato ? dataHoraBr(m.ultimo_contato) : '—'}`),
            el('button', { class: 'sec', onclick: () => acaoGestor('maquina_liberar', { ...dela, maquina: m.maquina }, `Liberar ${m.nome || 'este computador'}? Ele precisará ativar de novo com a chave.`) }, 'Liberar')))
            : [el('span', { class: 'dica' }, 'Nenhum computador ativado ainda.')]),
          el('div', { class: 'linha' }, el('label', {}, 'Limite desta chave (vazio = segue o plano)', limite),
            el('button', { class: 'sec', onclick: () => acaoGestor('limite_definir', { ...dela, limite: limite.value === '' ? null : Number(limite.value) }) }, 'Definir')))
      }
      painel.replaceChildren(
        el('div', { class: 'linha espaco' }, el('h3', {}, 'Gestor+ · licença'), el('span', { class: 'selo ' + cls }, textoSituacao(s.estado, s.dias))),
        el('p', { class: 'dica' }, s.vencimento ? 'Vencimento: ' + dataBr(s.vencimento) + ` · carência de ${diasTxt(s.carencia_dias || 0)} depois do vencimento; aviso ${diasTxt(s.aviso_dias || 0)} antes.`
          : atual.status === 'ativa' ? 'Sem vencimento definido: o acesso não vence.' : 'Sem data de vencimento.'),
        atual.status === 'ativa' ? el('div', { class: 'linha' }, el('label', {}, 'Vencimento', venc),
          el('button', { class: 'sec', onclick: () => (venc.value ? acaoGestor('vencimento_definir', { data: venc.value }) : erroLocal('Escolha a data do vencimento.')) }, 'Definir'),
          el('button', { class: 'sec', onclick: () => acaoGestor('vencimento_definir', { meses: 1 }) }, '+1 mês'),
          el('button', { class: 'sec', onclick: () => acaoGestor('vencimento_definir', { data: null }, 'Remover o vencimento? O acesso passa a não vencer.') }, 'Sem vencimento')) : null,
        el('p', { class: 'dica' }, 'Com cobranças emitidas pelo portal, a cobrança em aberto manda no vencimento; sem elas vale a data acima.'),

        ...(licencas.length ? licencas.map(blocoChave) : [el('h3', {}, 'Chave de licença'), aviso('Esta empresa ainda não tem chave.', 'aviso')]),
        el('div', { class: 'linha' }, ...(licencas.length ? [
          el('button', { class: 'sec', onclick: () => acaoGestor('chave_gerar', { modo: 'adicionar' }, 'Gerar mais uma chave para esta empresa?', msgChave) }, 'Adicionar outra chave'),
        ] : [
          el('button', { onclick: () => acaoGestor('chave_gerar', { enviar: true }, `Gerar a chave e enviar para ${r.empresa.email || 'o e-mail da empresa'}?`, msgChave) }, 'Gerar e enviar por e-mail'),
          el('button', { class: 'sec', onclick: () => acaoGestor('chave_gerar', {}, null, msgChave) }, 'Só gerar'),
        ])),

        el('h3', {}, 'Recuperação de acesso'),
        el('p', { class: 'dica' }, 'Para quando o cliente esquece a senha do administrador do Gestor+: o código vale 24 horas e só pode ser usado uma vez.'),
        el('div', { class: 'linha' }, el('button', { class: 'sec', disabled: !licencas.length, onclick: () => acaoGestor('recuperacao_gerar', {}, 'Gerar um código de recuperação do administrador?', (x) => `Código: ${x.codigo} (válido até ${dataHoraBr(x.expira_em)})`) }, 'Gerar código')))
    }
    desenhar(); carregarHistorico(); carregarPainel(); dlg.showModal()
  }

  // ----- Status dos serviços (deste sistema) -----
  const ESTADO = { ok: ['Operacional', 'ok'], falha: ['Com falha', 'erro'], nao_configurado: ['Não configurado', 'aviso'] }
  async function abaStatus(codigo, raiz) {
    const faixa = el('div', {}), cartoes = el('div', { style: 'display:grid;gap:12px' }), historico = el('div', { class: 'eventos' })
    const botao = el('button', { onclick: verificar }, 'Verificar agora')
    async function verificar() {
      botao.disabled = true; faixa.replaceChildren(aviso('Verificando…'))
      try {
        const r = await chamar('portal-geral', { acao: 'saude', sistema: codigo })
        const tudo = r.resumo.falha === 0 && r.resumo.nao_configurado === 0
        faixa.replaceChildren(aviso(tudo ? 'Todos os serviços estão operacionais.' : `${r.resumo.falha} com falha, ${r.resumo.nao_configurado} não configurado(s).`, r.resumo.falha > 0 ? 'erro' : tudo ? 'ok' : 'aviso'),
          el('p', { class: 'dica' }, 'Verificado em ' + dataHoraBr(r.verificado_em)))
        cartoes.replaceChildren(...r.itens.map((i) => { const [t, cls] = ESTADO[i.estado]
          return el('div', { class: 'card' },
            el('div', { class: 'linha espaco' }, el('strong', {}, 'Comunicação com a API de assinaturas'), el('span', { class: 'selo ' + cls, style: 'display:inline-flex;align-items:center' }, el('span', { class: 'ponto', 'aria-hidden': 'true' }), t)),
            i.detalhe ? el('p', { class: 'dica' }, i.detalhe) : null,
            i.milissegundos != null ? el('p', { class: 'dica' }, `Resposta em ${i.milissegundos} ms`) : null) }))
        historico.replaceChildren(...(r.chamadas.length ? r.chamadas.map((l) => el('div', {}, `${dataHoraBr(l.quando)} · ${l.acao} · ${l.ok ? 'ok' : 'falhou'}`)) : [el('span', {}, 'Sem chamadas registradas.')]))
      } catch (e) { faixa.replaceChildren(aviso(e.message, 'erro')) }
      botao.disabled = false
    }
    raiz.replaceChildren(
      el('div', { class: 'linha espaco' }, el('h3', {}, 'Status dos serviços'), botao),
      el('p', { class: 'dica' }, 'Testa de verdade a comunicação do portal com este sistema. Atualiza sozinho a cada 60 segundos.'),
      faixa, cartoes, el('h3', {}, 'Últimas chamadas'), historico)
    await verificar()
    temporizador = setInterval(() => { if (!botao.disabled) verificar() }, 60000)
  }

  // ----- Planos de assinatura (deste sistema) -----
  // A lista começa vazia: só aparecem os planos que você criar. O plano interno "trial" (teste grátis dos cadastros novos) e os desativados ficam escondidos
  // ("Mostrar desativados" os traz de volta).
  async function abaPlanos(codigo, raiz) {
    const caixa = el('div', { class: 'lista' })
    const desativados = el('input', { type: 'checkbox', 'aria-label': 'Mostrar desativados' })
    let todos = []
    function desenhar() {
      const lista = todos.filter((p) => p.codigo !== 'trial' && (p.ativo || desativados.checked))
      caixa.replaceChildren(...(lista.length ? lista.map((p) => el('button', { class: 'item', onclick: () => editarPlano(codigo, p, carregar) },
        el('div', { class: 'topo' }, el('strong', {}, p.nome), el('span', { class: 'selo ' + (p.ativo ? 'ok' : 'neutro') }, p.ativo ? 'Ativo' : 'Desativado')),
        el('div', { class: 'meta' }, el('span', {}, 'Código: ' + p.codigo), el('span', {}, moeda(p.preco_mensal) + '/mês'),
          ...(codigo === 'gestor'
            ? [el('span', {}, 'Computadores: ' + (p.max_veiculos == null ? 'ilimitado' : p.max_veiculos))]
            : [el('span', {}, 'Veículos: ' + (p.max_veiculos == null ? 'ilimitado' : p.max_veiculos)), el('span', {}, 'Usuários: ' + (p.max_usuarios == null ? 'ilimitado' : p.max_usuarios))]),
          el('span', {}, `${p.empresas} empresa(s) usando`)))) : [aviso('Nenhum plano criado ainda. Use "Novo plano" para criar os planos deste sistema.', 'aviso')]))
    }
    async function carregar() {
      caixa.replaceChildren(aviso('Carregando…'))
      try { todos = (await chamar('chamar-sistema', { sistema: codigo, acao: 'planos_listar' })).planos; desenhar() }
      catch (e) { caixa.replaceChildren(aviso(e.message, 'erro')) }
    }
    desativados.addEventListener('change', desenhar)
    raiz.replaceChildren(
      el('div', { class: 'linha espaco' }, el('h3', {}, 'Planos de assinatura'), el('button', { onclick: () => editarPlano(codigo, null, carregar) }, 'Novo plano')),
      el('p', { class: 'dica' }, 'Os limites e o preço valem dentro do sistema. Um plano em uso não pode ser desativado: troque o plano dos clientes antes.'),
      el('label', { class: 'marca' }, desativados, 'Mostrar desativados'),
      caixa)
    await carregar()
  }
  function editarPlano(codigo, p, aoSalvar) {
    const dlg = $('dlg'), c = $('dlg-conteudo')
    const novo = !p
    const f = {
      codigo: el('input', { value: p ? p.codigo : '', maxlength: 30, ...(novo ? {} : { disabled: true }), placeholder: 'ex.: premium' }),
      nome: el('input', { value: p ? p.nome : '', maxlength: 60 }),
      veic: el('input', { type: 'number', min: 1, value: p && p.max_veiculos != null ? p.max_veiculos : '', placeholder: 'vazio = ilimitado' }),
      usu: el('input', { type: 'number', min: 1, value: p && p.max_usuarios != null ? p.max_usuarios : '', placeholder: 'vazio = ilimitado' }),
      preco: el('input', { type: 'number', min: 0, step: '0.01', value: p ? p.preco_mensal : 0 }),
      ativo: el('input', { type: 'checkbox', ...(!p || p.ativo ? { checked: true } : {}) }),
    }
    const resultado = el('div', { class: 'oculto' })
    const salvar = el('button', { type: 'submit' }, 'Salvar')
    const form = el('form', { style: 'display:grid;gap:12px', onsubmit: async (ev) => {
      ev.preventDefault(); salvar.disabled = true; resultado.className = 'msg'; resultado.textContent = 'Salvando…'
      try {
        await chamar('chamar-sistema', { sistema: codigo, acao: 'plano_salvar', dados: {
          codigo: f.codigo.value.trim(), nome: f.nome.value.trim(), max_veiculos: f.veic.value === '' ? null : Number(f.veic.value),
          max_usuarios: f.usu.value === '' ? null : Number(f.usu.value), preco_mensal: f.preco.value === '' ? 0 : Number(f.preco.value), ativo: f.ativo.checked } })
        dlg.close(); aoSalvar()
      } catch (e) { resultado.className = 'msg erro'; resultado.textContent = e.message; salvar.disabled = false } } },
      el('label', {}, 'Código (não muda depois)', f.codigo), el('label', {}, 'Nome do plano', f.nome),
      codigo === 'gestor' ? el('label', {}, 'Máx. de computadores (vazio = ilimitado)', f.veic)
        : el('div', { class: 'dois' }, el('label', {}, 'Máx. de veículos', f.veic), el('label', {}, 'Máx. de usuários', f.usu)),
      el('label', {}, 'Preço mensal (R$)', f.preco),
      el('label', { class: 'marca' }, f.ativo, 'Plano ativo (disponível para as empresas)'),
      el('div', { class: 'linha' }, salvar, el('button', { type: 'button', class: 'sec', onclick: () => dlg.close() }, 'Cancelar'),
        novo ? null : el('button', { type: 'button', class: 'perigo', onclick: excluir }, 'Excluir plano')), resultado)
    async function excluir() {
      if (p.empresas > 0) { resultado.className = 'msg erro'; resultado.textContent = `Este plano está em uso por ${p.empresas} empresa(s): troque o plano delas antes de excluir.`; return }
      if (!confirm(`Excluir o plano "${p.nome}"? Isso não pode ser desfeito.`)) return
      resultado.className = 'msg'; resultado.textContent = 'Excluindo…'
      dlg.querySelectorAll('button').forEach((b) => (b.disabled = true))
      try { await chamar('chamar-sistema', { sistema: codigo, acao: 'plano_excluir', codigo: p.codigo }); dlg.close(); aoSalvar() }
      catch (e) { resultado.className = 'msg erro'; resultado.textContent = e.message; dlg.querySelectorAll('button').forEach((b) => (b.disabled = false)) }
    }
    c.replaceChildren(el('h2', {}, novo ? 'Novo plano' : 'Editar plano'), form)
    dlg.showModal()
  }

  // ---------- Mercado Pago (tela separada: é a mesma para todos os sistemas) ----------
  async function telaMercadoPago() {
    const ambiente = el('select', {}, el('option', { value: 'teste' }, 'Teste'), el('option', { value: 'producao' }, 'Produção'))
    const pub = el('input', { autocomplete: 'off', placeholder: 'APP_USR-… ou TEST-…' })
    const tok = el('input', { type: 'password', autocomplete: 'off', placeholder: 'APP_USR-… ou TEST-…' })
    const sec = el('input', { type: 'password', autocomplete: 'off' })
    const url = el('input', { type: 'url', autocomplete: 'off', placeholder: 'https://…' })
    const tokFim = el('span', { class: 'dica' }), secFim = el('span', { class: 'dica' }), quando = el('p', { class: 'dica' }), msg = el('div', { class: 'oculto' })
    const salvar = el('button', { type: 'submit' }, 'Salvar'), testar = el('button', { type: 'button', class: 'sec' }, 'Testar credenciais')
    const mostrar = (texto, tipo) => { msg.className = 'msg ' + (tipo || ''); msg.textContent = texto }
    function preencher(c) {
      ambiente.value = c.ambiente; pub.value = c.public_key || ''; url.value = c.url_notificacao || ''; tok.value = ''; sec.value = ''
      tokFim.textContent = c.access_token_final ? 'Guardado: ' + c.access_token_final : 'Nada guardado.'
      secFim.textContent = c.webhook_secret_final ? 'Guardado: ' + c.webhook_secret_final : 'Nada guardado.'
      quando.textContent = c.atualizado_em ? 'Última alteração: ' + dataHoraBr(c.atualizado_em) : ''
    }
    const form = el('form', { style: 'display:grid;gap:12px', onsubmit: async (ev) => {
      ev.preventDefault(); salvar.disabled = true
      try {
        const r = await chamar('config-mercadopago', { acao: 'salvar', ambiente: ambiente.value, public_key: pub.value, access_token: tok.value, webhook_secret: sec.value, url_notificacao: url.value })
        preencher(r.config); mostrar('Configuração salva.', 'ok')
      } catch (e) { mostrar(e.message, 'erro') }
      salvar.disabled = false } },
      el('label', {}, 'Ambiente', ambiente), el('label', {}, 'Public key', pub), el('label', {}, 'Access token', tok, tokFim),
      el('label', {}, 'Segredo do webhook (assinatura secreta)', sec, secFim), el('label', {}, 'URL de notificação (webhook)', url),
      el('div', { class: 'linha' }, salvar, testar))
    testar.onclick = async () => {
      testar.disabled = true; mostrar('Testando…')
      try { const r = await chamar('config-mercadopago', { acao: 'testar' }); r.ok ? mostrar(`Credenciais aceitas pelo Mercado Pago${r.conta.apelido ? ' (conta ' + r.conta.apelido + ')' : ''}.`, 'ok') : mostrar(r.erro, 'erro') }
      catch (e) { mostrar(e.message, 'erro') }
      testar.disabled = false
    }
    $('vista').replaceChildren(el('div', { class: 'card' },
      el('h2', {}, 'Mercado Pago'),
      el('p', { class: 'dica' }, 'Configuração única, usada por todos os sistemas. Os dados ficam guardados no servidor do portal. O access token e o segredo do webhook nunca voltam para esta tela: só os 4 últimos caracteres aparecem. Deixe em branco para manter o que já está guardado.'),
      form, msg, quando))
    preencher((await chamar('config-mercadopago', { acao: 'ler' })).config)
  }

  // ---------- login ----------
  $('form-entrar').addEventListener('submit', async (ev) => {
    ev.preventDefault(); $('msg-entrar').classList.add('oculto')
    const { error } = await banco.auth.signInWithPassword({ email: $('email').value.trim(), password: $('senha').value })
    if (error) { $('msg-entrar').textContent = 'E-mail ou senha incorretos.'; $('msg-entrar').classList.remove('oculto'); return }
    $('senha').value = ''; rotear()
  })
  $('sair').onclick = async () => { await banco.auth.signOut(); parar(); location.hash = ''; rotear() }
  banco.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') rotear() })
  rotear()
</script>
</body>
</html>
